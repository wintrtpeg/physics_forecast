# 윈도우 점검 — 사용자 PC 와 같은 방법으로 설치·실행하고 끝까지 돌려 본다.
#
#  launcher-online : run_pforecast.bat 더블클릭과 같은 경로 (인터넷 설치) + API 점검 + Edge 화면 점검
#  launcher-offline: wheels/ 묶음으로 인터넷 없이 설치 (PyPI 주소를 막아 둠) + API 점검
#  tests           : 전체 pytest 를 윈도우에서
#
# 러너는 영어 윈도우(기본 인코딩 cp1252)다. 한국어 윈도우(cp949)와 같은 종류의 문제 —
# 인코딩을 안 적은 파일 읽기, '\' 경로, 레지스트리 MIME — 를 똑같이 드러낸다.

name: windows

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-online:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 실행 → 대기 → 점검을 한 단계에서 (단계가 끝나면 백그라운드 앱도 같이 끝난다)
      - name: run_pforecast.bat 실행(인터넷 설치) → API 점검 → Edge 화면 점검 → 두 번째 실행
        shell: pwsh
        run: ./.github/workflows/app_check.ps1 -Ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-online
          path: |
            ui_shots/
            *.out.log
            *.err.log
          if-no-files-found: ignore

  launcher-offline:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 오프라인 묶음 만들기 (bat 이 쓸 파이썬 버전에 맞춰)
        shell: pwsh
        run: |
          $v = (py -3 -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')" 2>$null)
          if (-not $v) { $v = (python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')") }
          "bat 이 쓸 파이썬: $v"
          python scripts/make_offline_bundle.py --latest --python $v

      - name: run_pforecast.bat 실행 — 인터넷 없이 (PyPI 주소를 막음) → API 점검 → 두 번째 실행
        shell: pwsh
        env:
          PIP_INDEX_URL: "http://127.0.0.1:9/simple"
        run: ./.github/workflows/app_check.ps1

  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[plot,ml,dev]"
      - name: pytest (윈도우)
        run: python -m pytest tests -q
