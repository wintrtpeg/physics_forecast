[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pforecast"
version = "0.1.0"
description = "Physics-based (governing-equation) modeling and forecasting toolkit for fab utility systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 사내 PC에서 설치 가능한 것만. GPU/torch 계열 의존성은 절대 넣지 않는다.
plot = ["matplotlib>=3.7"]
sql = ["SQLAlchemy>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
pf = "pforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
