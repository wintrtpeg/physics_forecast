[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pforecast"
version = "0.1.0"
description = "Physics-based (governing-equation) modeling and forecasting toolkit for fab utility systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 사내 PC에서 설치 가능한 것만. GPU/torch 계열 의존성은 절대 넣지 않는다.
plot = ["matplotlib>=3.7"]
sql = ["SQLAlchemy>=2.0"]
# pf analyze 의 대리모델. CPU 전용이라 사내 PC 에 설치된다.
# 없으면 다항 릿지로 자동 대체되므로 필수는 아니다.
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4"]
all = ["matplotlib>=3.7", "SQLAlchemy>=2.0", "scikit-learn>=1.3"]

[project.scripts]
pf = "pforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 앱의 정적 파일은 패키지에 같이 들어가야 한다 (설치 후에도 pf serve 가 떠야 한다)
[tool.setuptools.package-data]
"pforecast.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
