# 구성방정식 후보 비교
#
# 스크러버의 제거효율식만 갈아끼우며 어느 형태가 맞는지 데이터로 고른다.
# 보존법칙은 네 후보 모두 동일하다 - 후보로 두지 않는다.

name: 스크러버 물질전달 상관식 후보 비교

model:
  python: model.py

data:
  csv: data/plant_5min.csv
  tagmap: tagmap.yaml

split:
  # 세 구간, 전부 시간순. 후보는 validate 로 고르고, test 는 **고르는 데 쓰지 않는다.**
  # test 로 고른 뒤 test 오차를 성능으로 보고하면 선택 누수다 (고른 구간이 유리하다).
  # 고르는 구간(validate)도 외삽이어야 한다 — 학습 범위 안에서 고르면 외삽 능력을 안 본다.
  # 램프업(3/21~) 뒤로 선택 구간과 시험 구간을 나란히 둔다.
  train:    "index < '2025-03-20'"
  validate: "index >= '2025-03-21' and index < '2025-03-25'"
  test:     "index >= '2025-03-26'"

target: STK.C_dry
slot: SCR                             # 교체할 컴포넌트

# 후보들이 갈리는 지점의 변수. 후보가 구분되지 않을 때
# "이 값을 의도적으로 흔든 데이터가 필요하다"고 알려주는 데 쓴다.
discriminator: SCR.LG

calibrate:
  # 후보와 무관하게 늘 함께 보정하는 파라미터 (계통 저항, 배출계수)
  common:
    - SRC_DRY.ef_process
    - SRC_DRY.ef_idle
    - SRC_CVD.ef_process
    - DCT_MAIN.K
    - SCR.K
  max_rows: 80
  prior_weight: 0.05

candidates:
  - id: ntu_power
    description: "NTU = a·(L/G)^b — 물질전달 이론 표준형"
    component: closures/scrubber_base.yaml
    calibrate: [SCR.ntu_a]

  - id: constant
    description: "η = 상수 — L/G 의존성 없음 (하한선 모델)"
    component: closures/scrubber_constant.yaml
    calibrate: [SCR.eta0]

  - id: langmuir
    description: "η = η_max·(L/G)/(k+L/G) — 포화형"
    component: closures/scrubber_langmuir.yaml
    calibrate: [SCR.k_LG]

  - id: ntu_power_T
    description: "NTU = a·(L/G)^b·(T/313K)^c — 온도항 추가 (과다 매개변수화 대조군)"
    component: closures/scrubber_ntu_temp.yaml
    calibrate: [SCR.ntu_a, SCR.ntu_c]

report: out/selection.html
