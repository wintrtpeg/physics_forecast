# 후보 A — 제거효율 상수.
#
# "스크러버는 그냥 일정 비율을 잡아준다"는 가장 단순한 가정. 학습 구간에서는
# 잘 맞을 수 있지만 유량이 바뀌어도 효율이 그대로라 외삽에서 무너진다.
# 비교의 하한선(null model)으로 반드시 포함해야 한다 - 더 복잡한 상관식이
# 이것보다 나은지 확인하지 않으면 복잡도가 값을 하는지 알 수 없다.

extends: scrubber_base.yaml
description: 제거효율 상수 (L/G 의존성 없음)

params:
  eta0: {value: 0.20, unit: "1", desc: 고정 제거효율, lo: 0.0, hi: 0.95, tunable: true}

equations:
  closure_eta: "eta = eta0"
