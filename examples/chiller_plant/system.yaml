# 냉수 플랜트 (칠러 + 냉각탑) — 파이썬 한 줄 없이 YAML 선언만으로 만든 계통.
#
# 배기 계통(nox_stack)과 완전히 다른 도메인이다. 포트 종류도 다르다 (thermal:
# 온도가 across, 열류가 through). core/ 는 한 줄도 고치지 않았다.
#
#   pf check examples/chiller_plant/system.yaml
#
# 물리의 핵심은 **응축온도를 통한 결합**이다.
#   부하 ↑  → 냉각탑 approach ↑ → 응축온도 ↑ → COP ↓ → 전력 ↑↑
#   습구온도 ↑ (여름) → 응축온도 ↑ → COP ↓
# 이 곱셈 효과 때문에 여름 피크에서 전력이 비선형으로 튄다. 과거 데이터에 없던
# 부하·외기 조합을 물어보려면 회귀로는 안 되고 이 구조가 있어야 한다.
#
# 열 흐름:  부하 → [증발기] 칠러 [응축기] → 냉각탑 → 대기
# thermal 포트의 through(Q) 부호는 '컴포넌트로 들어가는 방향'이 + 다.

name: chiller_plant

drivers:
  - {key: Q_load,  label: 냉방부하,        unit: kW,   lo: 500,  hi: 6000}
  - {key: T_wb,    label: 외기 습구온도,    unit: degC, lo: 5,    hi: 32}
  - {key: T_chws,  label: 냉수 공급온도,    unit: degC, lo: 5,    hi: 12}
  - {key: app_nom, label: 냉각탑 접근온도차, unit: K,    lo: 2.5,  hi: 9}

#: 현장에서 재는 값 (보정·검증에 씀). 간편 예측의 컬럼 연결 추천이 이 설명을 본다
observables:
  PLANT.W_total: 플랜트 총 전력 [kW]
  CHILLER.COP: 칠러 성적계수 (COP)
  TOWER.T_cw: 냉각수 온도 [degC]

limits:
  PLANT.kW_per_RT: {max: 0.85, label: 에너지 원단위 관리기준}
  CHILLER.COP:     {min: 4.5,  label: COP 하한}

components:
  # 각 컴포넌트의 식은 패키지 라이브러리(src/pforecast/lib/components/*.yaml)에 있다.
  # 모델 만들기 화면에서도 같은 라이브러리를 쓴다. 값만 바꿀 때는 values: 로 덮어쓴다.
  LOAD:    {type: equation, spec: "lib:cooling_load"}      # 냉방부하 (경계)
  CHILLER: {type: equation, spec: "lib:chiller_carnot"}    # 칠러: COP = 카르노 한계 x 효율
  TOWER:   {type: equation, spec: "lib:cooling_tower"}     # 냉각탑: 접근온도차가 부하에 따라 커진다
  AMBIENT: {type: equation, spec: "lib:thermal_ambient"}   # 외기 습구온도 = 최종 열싱크
  PLANT:   {type: equation, spec: "lib:plant_panel"}       # 배전반: 전력 집계

connections:
  # 열 흐름
  - [LOAD.out,     CHILLER.evap]
  - [CHILLER.cond, TOWER.hot]
  - [TOWER.amb,    PLANT.a]
  - [PLANT.b,      AMBIENT.a]
  # 전력 흐름
  - [CHILLER.elec, PLANT.chiller]
  - [TOWER.elec,   PLANT.tower]
